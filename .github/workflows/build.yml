name: Build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

# The tag push creates the GitHub Release, which needs contents: write. Without this the
# default token is read-only and softprops/action-gh-release fails with HTTP 403.
permissions:
  contents: write

jobs:
  # The LKM selection rules are pure logic, and they live in a header precisely so
  # they can be run here: exp.c itself only compiles against the NDK, so without
  # this split the table and its matching rules would ship untested.
  ko-select-tests:
    name: Native selection logic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build and run tests/ko_select_test.c
        run: |
          cc -std=gnu11 -Wall -Wextra -Werror -I app/src/main/jni \
             tests/ko_select_test.c -o /tmp/ko_select_test
          /tmp/ko_select_test

  build-lkms:
    name: LKMs / ${{ matrix.kmi }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
          - android17-6.18
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-20260828
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - name: Build dfroot.ko
        run: |
          cd lkm
          # lkm/Makefile owns the section diet - do not repeat it here. An extra
          # llvm-objcopy pass used to run on top of it and stripped
          # .note.gnu.build-id, which upstream deliberately keeps: without that
          # section the module fails to load on the Galaxy A34 (SM-A346M,
          # 6.6.92). Keeping one diet definition also makes CI output byte-for-byte
          # what the root Makefile produces in the same DDK image.
          make -j$(nproc)
          mkdir -p $GITHUB_WORKSPACE/out
          cp dfroot.ko $GITHUB_WORKSPACE/out/dfroot-${{ matrix.kmi }}.ko
          make clean

      - name: Upload dfroot.ko
        uses: actions/upload-artifact@v7
        with:
          name: df-lkm-${{ matrix.kmi }}
          path: out/dfroot-${{ matrix.kmi }}.ko

  build-dfroot:
    needs: build-lkms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-java has to come first: the ephemeral-keystore step below needs
      # keytool on PATH, and build.gradle.kts needs a JDK for Gradle itself.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Only a tag run publishes a Release, so only a tag run needs the real
      # signing key. Push / manual / PR runs are test builds: generate the
      # keystore on the runner with the same recipe the README documents, so a
      # fresh fork can produce an installable APK without configuring any
      # secret. Those APKs carry a throwaway key - they cannot be installed as
      # an update over a release-signed build, so uninstall first when swapping.
      - name: Validate signing config
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "${{ secrets.KEYSTORE }}" = "" ]; then
            echo "::error::Signing secrets not configured. KEYSTORE secret is required for tagged releases."
            exit 1
          fi

      - name: Create keystore from secret
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # app/build.gradle.kts signs with app/keystore.jks (gitignored; the README
          # documents how to generate it), so the KEYSTORE secret has to be decoded
          # into app/, not into the repo root the upstream workflow used.
          echo ${{ secrets.KEYSTORE }} | base64 --decode > app/keystore.jks
          ls -l app/keystore.jks

      - name: Create ephemeral keystore for test builds
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          keytool -genkeypair -v -keystore app/keystore.jks -alias dirtyfrag \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass dirtyfrag -keypass dirtyfrag \
            -dname "CN=DirtyFrag CI, OU=CI, O=DirtyFrag, L=Unknown, ST=Unknown, C=US"
          ls -l app/keystore.jks

      - name: Download DF LKMs
        uses: actions/download-artifact@v7
        with:
          pattern: df-lkm-*
          merge-multiple: true
          path: app/src/main/jni/ko/

      - uses: gradle/actions/setup-gradle@v6

      - name: Build DFRoot APK
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./gradlew :app:assembleDebug
          else
            ./gradlew :app:assembleRelease
          fi

      - name: Stage release asset
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # app/build.gradle.kts always writes app/build/outputs/apk/release/dirtyfrag.apk,
          # so the versioned asset name comes from the tag (v1.11 -> DirtyFrag-v1.11.apk).
          cp app/build/outputs/apk/release/dirtyfrag.apk "DirtyFrag-${GITHUB_REF_NAME}.apk"
          ls -l DirtyFrag-*.apk

      - name: Upload DFRoot APK
        uses: actions/upload-artifact@v7
        with:
          name: DFRoot
          path: |
            app/build/outputs/apk/release/dirtyfrag.apk
            app/build/outputs/apk/debug/dirtyfrag.apk

      - name: Build release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # Take just the section for this tag: v1.11 -> the "## 1.11" block.
          VER="${GITHUB_REF_NAME#v}"
          awk -v ver="$VER" '/^## /{p = ($0 == "## " ver); next} p' CHANGELOG.md > RELEASE_NOTES.md
          wc -l RELEASE_NOTES.md

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: DirtyFrag-*.apk
          body_path: RELEASE_NOTES.md
